<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080f0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<title>ZIULFIT — Avaliação e plano personalizado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="logo" id="logoHome" role="button" tabindex="0" aria-label="Voltar à página inicial">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12h3l2-5 3 10 2.5-7 1.5 2h4" stroke="#0a1512" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="wordmark">ZIUL<span class="fit">FIT</span></span>
    </div>
    <div class="step-tag" id="stepTag">INÍCIO</div>
  </div>
  <div class="mprogress" id="mprogress"><i id="mprogressBar" style="width:0%"></i></div>
  <div class="layout">
    <div class="rail" id="rail"></div>
    <div id="app"></div>
  </div>
  <div class="footer">ZIULFIT © 2026 — SEU CORPO, SEU PLANO</div>
</div>

<script src="assets/js/app.js" defer></script>
</body>
</html>
